# cdemo.cfg -- ld65 configuration for the direct-boot C demo
#
# Derived from cc65's apple2enh.cfg. The program loads at $6000 from a disk
# with no DOS on it, so this file differs from the stock one in three ways:
#
#   - There is no AppleSingle header. The direct-boot loader copies the file
#     to memory byte for byte.
#   - The BOOT segment from boot.s comes first, so the load address is also
#     the entry point. Its code falls through into cc65's STARTUP code.
#   - The language card size is the DOS 3.3 value, since no operating system
#     uses bank two.

FEATURES {
    STARTADDRESS: default = $6000;
}
SYMBOLS {
    __STACKSIZE__: type = weak, value = $0800; # 2k stack
    __HIMEM__:     type = weak, value = $9600; # top of the C stack
    __LCADDR__:    type = weak, value = $D000;
    __LCSIZE__:    type = weak, value = $2FFC;
}
MEMORY {
    ZP:     file = "", define = yes, start = $0080,        size = $001A;
    MAIN:   file = %O, define = yes, start = %S,           size = __HIMEM__ - %S;
    BSS:    file = "",               start = __ONCE_RUN__, size = __HIMEM__ - __STACKSIZE__ - __ONCE_RUN__;
    LC:     file = "", define = yes, start = __LCADDR__,   size = __LCSIZE__;
    LOW:    file = "", define = yes, start = $0800,        size = %S - $0800;
}
SEGMENTS {
    ZEROPAGE: load = ZP,             type = zp;
    BOOT:     load = MAIN,           type = ro;
    STARTUP:  load = MAIN,           type = ro;
    LOWCODE:  load = MAIN,           type = ro,  optional = yes;
    CODE:     load = MAIN,           type = ro;
    RODATA:   load = MAIN,           type = ro;
    DATA:     load = MAIN,           type = rw;
    INIT:     load = MAIN,           type = rw;  # uninitialized, but reserves output space
    ONCE:     load = MAIN,           type = ro,  define   = yes;
    LC:       load = MAIN, run = LC, type = ro,  optional = yes;
    BSS:      load = BSS,            type = bss, define   = yes;
    LOWBSS:   load = LOW,            type = bss, optional = yes;
}
FEATURES {
    CONDES: type    = constructor,
            label   = __CONSTRUCTOR_TABLE__,
            count   = __CONSTRUCTOR_COUNT__,
            segment = ONCE;
    CONDES: type    = destructor,
            label   = __DESTRUCTOR_TABLE__,
            count   = __DESTRUCTOR_COUNT__,
            segment = RODATA;
    CONDES: type    = interruptor,
            label   = __INTERRUPTOR_TABLE__,
            count   = __INTERRUPTOR_COUNT__,
            segment = RODATA,
            import  = __CALLIRQ__;
}
