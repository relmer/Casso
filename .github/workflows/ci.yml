name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

# Least privilege at the top; the `release` job widens this for itself. Signing
# needs `id-token: write` to mint the OIDC token Azure trades for credentials,
# and nothing else in this file has any business minting one.
permissions:
  contents: read

jobs:
  # Full-tree style audit. The pre-push hook checks only the lines a push
  # adds; this is the backstop that keeps the swept-to-zero backlog at zero
  # -- Tree mode fails on ANY violation anywhere, so a rule can never drift
  # back the way the hand-enforced standards did. Runs on every push and PR,
  # and is deliberately its own job: a style failure should read as "style",
  # not surface as a mysterious build error.
  style:
    runs-on: windows-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v6

      - name: Style gate (full tree)
        shell: pwsh
        run: scripts/CheckStyle.ps1 -Mode Tree

  build-and-test:
    runs-on: windows-latest
    timeout-minutes: 30
    strategy:
      matrix:
        configuration: [Debug, Release]
        platform: [x64]
      fail-fast: false

    steps:
      - uses: actions/checkout@v6

      - name: Add MSBuild to PATH
        uses: microsoft/setup-msbuild@v3

      # Locate vstest.console.exe with vswhere directly rather than through
      # darenm/Setup-VSTest: that action is a thin wrapper around the same
      # lookup, targets the deprecated Node 20 runtime, and is one more
      # third-party dependency in the supply chain.
      - name: Add VSTest to PATH
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vstest  = & $vswhere -latest -products * -find '**\TestPlatform\vstest.console.exe' |
                     Select-Object -First 1
          if (-not $vstest) { throw 'vstest.console.exe not found' }
          Add-Content $env:GITHUB_PATH (Split-Path $vstest)

      - name: Build
        run: msbuild Casso.sln -p:Configuration=${{ matrix.configuration }} -p:Platform=${{ matrix.platform }} -p:PreBuildEventUseInBuild=false -p:PostBuildEventUseInBuild=false -p:EnableCppCoreCheck=true -p:RunCodeAnalysis=true -p:CodeAnalysisTreatWarningsAsErrors=true

      # The ROMs are Apple's and are not in the repository. The suite reads
      # them from UnitTest/Fixtures, so they are fetched from their pinned
      # upstream homes here and verified by name before anything runs --
      # a missing one fails this step rather than skipping the tests that
      # need it.
      - name: Fetch fixture ROMs
        run: scripts/FetchRoms.ps1 -Fixtures

      - name: Run Tests
        run: vstest.console.exe ${{ matrix.platform }}/${{ matrix.configuration }}/UnitTest.dll

      # The committed demo disk has to be what its sources build.
      #
      # This check used to live inside BootDiskTests, which wrote the image it
      # had just built over Apple2/Demos/casso-rocks.dsk on every run. It
      # normally wrote the same bytes back, so the only trace was a moved
      # mtime, until a run that built a DIFFERENT image and left a corrupted
      # binary asset in the tree. A unit test may not touch the tree, so the
      # test no longer reads or writes that file at all -- which left the
      # freshness question with nobody asking it. This is who asks.
      #
      # x64 only: the script needs a CassoCli it can run, and an ARM64 build on
      # an x64 runner is not one.
      - name: Demo disk matches its sources
        if: matrix.platform == 'x64'
        shell: pwsh
        run: scripts/BuildDemoDisk.ps1 -Verify -Configuration ${{ matrix.configuration }}

      # The same question for every demo folder that carries a Build.ps1, and
      # the speech demo has an extra reason to be asked it: its data tables are
      # GENERATED, not written. Editing a line of speech changes nothing until
      # gen-speech-demo-data.py runs, and nothing about the edit says so -- the
      # .a65 still assembles, the disk still boots, and it still says the old
      # line. The script builds every such folder and compares, and puts the
      # tree back either way so it cannot fail the check below for its own
      # reasons.
      - name: Mockingboard demo disks match their sources
        if: matrix.platform == 'x64'
        shell: pwsh
        run: scripts/CheckDemoDisks.ps1 -Configuration ${{ matrix.configuration }}

      # And nothing in the job may have changed a tracked file. CI runs
      # vstest directly rather than through scripts/RunTests.ps1, so the
      # mtime guard there never sees a CI run; this is the same rule stated
      # where CI can enforce it. Content, not mtime: a byte-identical write
      # cannot hurt a checkout that is thrown away.
      - name: Working tree is unchanged
        shell: pwsh
        run: |
          $dirty = git status --porcelain
          if ($dirty) {
              Write-Host 'The build or the tests changed tracked files:' -ForegroundColor Red
              $dirty | ForEach-Object { Write-Host "  $_" -ForegroundColor Yellow }
              exit 1
          }

      # Hand the Release x64 binaries to the release job so it doesn't rebuild
      # them. Only on master pushes (the only place the release job runs).
      - name: Upload Release x64 binaries
        if: matrix.configuration == 'Release' && github.ref == 'refs/heads/master'
        uses: actions/upload-artifact@v7
        with:
          name: release-x64
          path: |
            x64/Release/Casso.exe
            x64/Release/CassoCli.exe
          retention-days: 1

  build-arm64:
    runs-on: windows-latest
    timeout-minutes: 30
    strategy:
      matrix:
        configuration: [Debug, Release]
      fail-fast: false

    steps:
      - uses: actions/checkout@v6

      - name: Add MSBuild to PATH
        uses: microsoft/setup-msbuild@v3

      - name: Build ARM64
        run: msbuild Casso.sln -p:Configuration=${{ matrix.configuration }} -p:Platform=ARM64 -p:PreBuildEventUseInBuild=false -p:PostBuildEventUseInBuild=false -p:EnableCppCoreCheck=true -p:RunCodeAnalysis=true -p:CodeAnalysisTreatWarningsAsErrors=true

      # Hand the Release ARM64 binaries to the release job so it doesn't rebuild
      # them. Only on master pushes (the only place the release job runs).
      - name: Upload Release ARM64 binaries
        if: matrix.configuration == 'Release' && github.ref == 'refs/heads/master'
        uses: actions/upload-artifact@v7
        with:
          name: release-arm64
          path: |
            ARM64/Release/Casso.exe
            ARM64/Release/CassoCli.exe
          retention-days: 1

  release:
    # Auto-publish a GitHub release for every passing master push. The release
    # version is read from CassoCore/Version.h; if a tag for that version
    # already exists, this job no-ops (so a re-push without a Version.h bump
    # doesn't overwrite the previous release). The Release x64/ARM64 binaries
    # are reused from the build jobs (download-artifact), not rebuilt here.
    needs: [build-and-test, build-arm64]
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: windows-latest
    timeout-minutes: 45

    permissions:
      contents: write   # push the tag + create the release
      id-token: write   # OIDC federation to Azure Artifact Signing

    # The Entra federated credential is registered against a subject that names
    # this environment, so the name here is part of the auth, not a label --
    # including its case, which the OIDC subject carries verbatim.
    environment: release

    env:
      # Lifted into `env` so the signing steps can gate on it: `secrets` is not
      # available in an `if`, `env` is. Empty means this repo has not been given
      # the signing secrets yet, and the release goes out UNSIGNED rather than
      # turning every master push red.
      AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      WINGET_PAT:      ${{ secrets.WINGET_PAT }}

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0   # need full history so `git tag` can see existing tags

      - name: Read version from Version.h
        id: ver
        shell: pwsh
        run: |
          $verPath = 'CassoCore/Version.h'
          $content = Get-Content $verPath -Raw
          if ($content -notmatch '#define VERSION_MAJOR (\d+)') { throw 'VERSION_MAJOR missing' }
          $major = $matches[1]
          if ($content -notmatch '#define VERSION_MINOR (\d+)') { throw 'VERSION_MINOR missing' }
          $minor = $matches[1]
          if ($content -notmatch '#define VERSION_PATCH (\d+)') { throw 'VERSION_PATCH missing' }
          $patch = $matches[1]
          $version = "$major.$minor.$patch"
          $tag     = "v$version"
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "tag=$tag"         | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          Write-Host "Version: $version  Tag: $tag"

      - name: Skip if release or tag already exists
        id: check
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = '${{ steps.ver.outputs.tag }}'

          # Two ways the release path can be a no-op:
          #   (a) the release itself exists -- another run already
          #       published it.
          #   (b) the release doesn't exist but the tag does -- a
          #       previous `gh release create` raced and created the
          #       tag before failing (e.g. a force-push amend, or two
          #       simultaneous master pushes with the same Version.h).
          #       Re-running `gh release create` would just fail with
          #       "tag already exists" again.
          # Skip in both cases. If the tag-without-release state is
          # ever real (someone manually deleted a release), recover
          # by deleting the orphan tag and re-pushing.
          $releaseExists = $false
          gh release view $tag --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -eq 0) { $releaseExists = $true }

          $tagExists = $false
          gh api "repos/$env:GITHUB_REPOSITORY/git/refs/tags/$tag" *> $null
          if ($LASTEXITCODE -eq 0) { $tagExists = $true }

          if ($releaseExists) {
            Write-Host "Release $tag already exists -- skipping."
            "exists=true"  | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          } elseif ($tagExists) {
            Write-Host "Tag $tag exists without a matching release " `
                       "(probably an orphan from a prior race) -- skipping."
            "exists=true"  | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          } else {
            Write-Host "Release $tag does not exist -- will publish."
            "exists=false" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          }
          # Reset $LASTEXITCODE: gh's lookup-failure exit propagates as the
          # step's exit code if we don't explicitly clear it.
          $global:LASTEXITCODE = 0

      # Reuse the Release binaries the build-and-test / build-arm64 jobs already
      # produced instead of rebuilding them here (saved ~7 min per release).
      - name: Download Release x64 binaries
        if: steps.check.outputs.exists != 'true'
        uses: actions/download-artifact@v8
        with:
          name: release-x64
          path: x64/Release

      - name: Download Release ARM64 binaries
        if: steps.check.outputs.exists != 'true'
        uses: actions/download-artifact@v8
        with:
          name: release-arm64
          path: ARM64/Release

      # Staged before signing, so that what gets signed is what gets shipped.
      # Both the zips and the MSIX are built from this tree afterwards.
      # scripts/StageRelease.ps1 holds the list of what ships and why each
      # thing is on it; the packaging dry run stages from the same script.
      - name: Stage release payloads
        if: steps.check.outputs.exists != 'true'
        shell: pwsh
        run: scripts/StageRelease.ps1 -Platforms x64, ARM64

      - name: Azure login (OIDC)
        if: steps.check.outputs.exists != 'true' && env.AZURE_CLIENT_ID != ''
        uses: azure/login@v3
        with:
          client-id:       ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id:       ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      # One call covers both platforms: the staging tree holds x64 and ARM64
      # side by side, and an ARM64 PE signs on an x64 runner like any other.
      - name: Sign the staged binaries
        if: steps.check.outputs.exists != 'true' && env.AZURE_CLIENT_ID != ''
        uses: azure/artifact-signing-action@v2.0.0
        with:
          azure-tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          azure-client-id: ${{ secrets.AZURE_CLIENT_ID }}
          endpoint: https://wcus.codesigning.azure.net/
          signing-account-name: relmer-signing
          certificate-profile-name: relmer-public
          files-folder: ${{ github.workspace }}/staging
          files-folder-filter: exe
          files-folder-recurse: true
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256

      # A signing action that fails is loud; one that runs and leaves a file
      # untouched is not. Four binaries ship, so four have to carry a
      # signature.
      #
      # The bar is a signature that is PRESENT and matches the bytes, not a
      # Status of Valid. Valid additionally asserts that this runner could
      # build and trust the chain, which is a fact about the runner rather
      # than about the release, and making it a gate would let a trust-store
      # detail on a hosted image turn a good build red.
      - name: Verify every binary is signed
        if: steps.check.outputs.exists != 'true' && env.AZURE_CLIENT_ID != ''
        shell: pwsh
        run: |
          $bad = @()
          Get-ChildItem staging -Recurse -Filter *.exe | ForEach-Object {
            $sig = Get-AuthenticodeSignature $_.FullName
            Write-Host "  $($_.Name): $($sig.Status) -- $($sig.SignerCertificate.Subject)"
            if ($sig.Status -in @('NotSigned', 'HashMismatch')) { $bad += $_.Name }
          }
          if ($bad) { throw "Unsigned or tampered after signing: $($bad -join ', ')" }

      - name: Warn that the release is unsigned
        if: steps.check.outputs.exists != 'true' && env.AZURE_CLIENT_ID == ''
        shell: pwsh
        run: |
          Write-Host ('::warning::AZURE_CLIENT_ID is not set, so this release ships UNSIGNED and ' +
                      'SmartScreen will warn on first run. Add the AZURE_CLIENT_ID, ' +
                      'AZURE_TENANT_ID and AZURE_SUBSCRIPTION_ID secrets, and register a ' +
                      'federated credential for ' +
                      'repo:${{ github.repository }}:environment:release.')

      # --- MSIX ---
      #
      # AFTER the signing steps, never before. The bundle carries the staged
      # executables verbatim, and signing a container does not reach inside
      # it, so a bundle packed ahead of this point would hold two unsigned
      # binaries under a signed wrapper.
      #
      # Gated on the signing credential for a second reason: an unsigned
      # msixbundle cannot be installed at all. A zip that ships unsigned still
      # runs, with a SmartScreen warning; an MSIX that ships unsigned is a
      # download that does nothing but fail, so the unsigned path publishes
      # the zips alone rather than a file no one can open.
      #
      # scripts/BuildMsix.ps1 says why an MSIX exists at all, and what the
      # portable zip did in winget's validator that made it necessary.
      - name: Build the MSIX bundle
        if: steps.check.outputs.exists != 'true' && env.AZURE_CLIENT_ID != ''
        shell: pwsh
        run: |
          scripts/BuildMsix.ps1 `
            -PayloadRoot staging `
            -OutputDirectory artifacts `
            -Version '${{ steps.ver.outputs.version }}' `
            -Platforms x64, ARM64

      # The filter is not redundant even though the bundle is the only thing
      # in `artifacts` at this point. The zips land in the same folder a few
      # steps later, and an unfiltered folder is the kind of thing that keeps
      # working until someone reorders the steps.
      - name: Sign the MSIX bundle
        if: steps.check.outputs.exists != 'true' && env.AZURE_CLIENT_ID != ''
        uses: azure/artifact-signing-action@v2.0.0
        with:
          azure-tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          azure-client-id: ${{ secrets.AZURE_CLIENT_ID }}
          endpoint: https://wcus.codesigning.azure.net/
          signing-account-name: relmer-signing
          certificate-profile-name: relmer-public
          files-folder: ${{ github.workspace }}/artifacts
          files-folder-filter: msixbundle
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256

      # A bundle whose signature did not take is not a lesser release, it is
      # an uninstallable one: Windows refuses to deploy an unsigned package,
      # and winget's validator refuses it before that. So this is a hard gate
      # where the same check on the executables is a softer one.
      #
      # The publisher is checked too, because the way an MSIX signature fails
      # is specific: signtool requires the certificate subject to match the
      # manifest's Publisher string exactly, and a mismatch there is the one
      # thing that would sail through every other check in this job. The
      # manifest is read back out of the signed bundle rather than out of the
      # tree, so what is asserted is what shipped.
      - name: Verify the bundle is signed
        if: steps.check.outputs.exists != 'true' && env.AZURE_CLIENT_ID != ''
        shell: pwsh
        run: |
          $bundle = Get-ChildItem artifacts -Filter *.msixbundle | Select-Object -First 1
          if (-not $bundle) { throw 'No .msixbundle was produced.' }

          $sig = Get-AuthenticodeSignature $bundle.FullName
          Write-Host "  $($bundle.Name): $($sig.Status) -- $($sig.SignerCertificate.Subject)"

          if ($sig.Status -in @('NotSigned', 'HashMismatch')) {
              throw "$($bundle.Name) is $($sig.Status); the bundle cannot be installed."
          }

          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $zip = [IO.Compression.ZipFile]::OpenRead($bundle.FullName)
          try {
              $entry = $zip.Entries | Where-Object { $_.FullName -eq 'AppxMetadata/AppxBundleManifest.xml' }
              if (-not $entry) { throw 'The bundle has no AppxBundleManifest.xml.' }

              $reader = New-Object IO.StreamReader($entry.Open())
              try { $xml = [xml] $reader.ReadToEnd() } finally { $reader.Dispose() }
          }
          finally {
              $zip.Dispose()
          }

          $publisher = $xml.Bundle.Identity.Publisher
          $subject   = $sig.SignerCertificate.Subject
          Write-Host "  manifest publisher: $publisher"

          if ($publisher -ne $subject) {
              throw ("The bundle's Publisher and the signing certificate's subject differ, so " +
                     "Windows will reject the package.`n  manifest: $publisher`n  cert:     $subject`n" +
                     'Update Identity/@Publisher in Installer/Package.appxmanifest to the subject above.')
          }

      - name: Package release zips
        if: steps.check.outputs.exists != 'true'
        shell: pwsh
        run: |
          $version = '${{ steps.ver.outputs.version }}'

          # Compress-Archive does not create the destination's parent, and on
          # the unsigned path nothing upstream of here has: BuildMsix.ps1
          # makes this folder, and it does not run without a signing
          # credential.
          New-Item -ItemType Directory -Path artifacts -Force | Out-Null

          foreach ($plat in @('x64', 'ARM64')) {
            $zipName = "Casso-$version-$plat.zip"
            Compress-Archive -Path "staging/Casso-$plat" -DestinationPath "artifacts/$zipName" -Force
            Write-Host "Packaged: artifacts/$zipName"
          }

      # The zips cannot be signed -- Authenticode lives inside a PE, and an
      # archive has nowhere to put it. The four binaries inside carry their own
      # signatures, so Windows still knows who published what a user runs; what
      # a signature on the exe cannot vouch for is everything ELSE in the
      # archive, the demo disks and the docs, or that the archive arrived whole.
      # That is what this answers.
      #
      # The listing names the assets a person downloads, not the files inside
      # them, since the download is the thing they can check before opening it.
      #
      # `<hash>  <name>` with two spaces and a bare filename is the sha256sum
      # format, so `sha256sum -c SHA256SUMS.txt` verifies it as-is next to the
      # downloads. Lowercase for the same reason: that is what the tools emit
      # and what a reader comparing by eye will have in front of them.
      - name: Checksum the release assets
        if: steps.check.outputs.exists != 'true'
        shell: pwsh
        run: |
          # Everything in the folder, not a list of extensions: every file in
          # `artifacts` is a release asset by construction, and a named list
          # is how the bundle would have been left out of this when it was
          # added. SHA256SUMS.txt is written afterwards and so is not yet
          # here to checksum itself.
          $lines = Get-ChildItem artifacts -File | Sort-Object Name | ForEach-Object {
            "{0}  {1}" -f (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower(), $_.Name
          }

          if (-not $lines) { throw 'No release assets to checksum.' }

          # No BOM and LF endings: a BOM breaks the first line for `sha256sum -c`,
          # and the tool is likelier to be run on a machine that would rather not
          # see CR either.
          [IO.File]::WriteAllText(
            (Join-Path (Get-Location) 'artifacts/SHA256SUMS.txt'),
            ($lines -join "`n") + "`n",
            (New-Object Text.UTF8Encoding $false))

          Get-Content artifacts/SHA256SUMS.txt | ForEach-Object { Write-Host "  $_" }

      - name: Create release
        if: steps.check.outputs.exists != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: |
          $tag     = '${{ steps.ver.outputs.tag }}'
          $version = '${{ steps.ver.outputs.version }}'
          $title   = "Casso $version"
          # Pull the matching changelog section if present; fall back to a
          # short auto-generated body.
          $body = ''
          $changelog = Get-Content CHANGELOG.md -Raw
          $pattern = "(?ms)^## \[$([regex]::Escape($version))\][^\r\n]*\r?\n(.*?)(?=^## \[|\z)"
          $m = [regex]::Match($changelog, $pattern)
          if ($m.Success) {
            $body = $m.Groups[1].Value.Trim()
          } else {
            $body = "Automated release of commit $env:GITHUB_SHA. See CHANGELOG.md for details."
          }
          $bodyFile = Join-Path $env:RUNNER_TEMP 'release-body.md'
          Set-Content -Path $bodyFile -Value $body -Encoding utf8
          gh release create $tag (Get-Item artifacts/*).FullName `
            --repo $env:GITHUB_REPOSITORY `
            --title $title `
            --notes-file $bodyFile `
            --target $env:GITHUB_SHA

      # --- winget ---
      #
      # After the release, not before: wingetcreate downloads the assets from
      # their published URLs to hash them, so they have to be live.
      #
      # `update` can only update a package that EXISTS. The first manifest for
      # relmer.Casso is a `wingetcreate new` submitted by hand once; this step
      # checks for it and says so rather than failing a release over a package
      # nobody has published yet. Once that PR merges, this starts working on
      # its own and needs no edit.
      - name: Publish to winget
        if: steps.check.outputs.exists != 'true' && env.WINGET_PAT != ''
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.WINGET_PAT }}
        run: |
          $version = '${{ steps.ver.outputs.version }}'
          $tag     = '${{ steps.ver.outputs.tag }}'
          $pkgId   = 'relmer.Casso'

          # A TOKEN THAT IS NON-EMPTY IS NOT A TOKEN THAT WORKS. The gate on the
          # step only proves the secret holds characters, which a placeholder
          # does too. Ask GitHub who the token is and what it may do.
          #
          # First, so that every release reports on the token, including the
          # ones that go on to no-op below. A credential is worth checking
          # before the release that depends on it, not during.
          #
          # public_repo is what the submission needs: wingetcreate pushes a
          # branch to the fork and opens a pull request with it. workflow is
          # wanted too, for the fork sync rather than the manifest -- nothing
          # written here goes under .github/workflows, but merge-upstream
          # brings upstream's commits in as this token, and winget-pkgs changes
          # its own workflow files often enough that a sync carries one.
          $who = gh api user --jq '.login' 2>$null
          $tokenOk = ($LASTEXITCODE -eq 0 -and $who)
          $global:LASTEXITCODE = 0

          if ($tokenOk) {
              $scopes = (gh api user --include 2>$null |
                         Select-String -Pattern '^x-oauth-scopes:' |
                         ForEach-Object { $_.Line -replace '(?i)^x-oauth-scopes:\s*', '' })
              $global:LASTEXITCODE = 0
              Write-Host "  WINGET_PAT authenticates as $who; scopes: $scopes"

              if ($scopes -and $scopes -notmatch 'public_repo|(^|,\s*)repo(,|$)') {
                  $tokenOk = $false
                  $tokenProblem = "the token lacks public_repo (scopes: $scopes)"
              }
              elseif ($scopes -and $scopes -notmatch '(^|,\s*)workflow(,|$)') {
                  Write-Host ('::warning::WINGET_PAT has no workflow scope. The fork sync can ' +
                              'fail when upstream has changed its own workflow files.')
              }
          }
          else {
              $tokenProblem = 'the token does not authenticate'
          }

          # `update` can only update a package that EXISTS. The first manifest
          # for relmer.Casso is a `wingetcreate new` submitted by hand once.
          gh api "repos/microsoft/winget-pkgs/contents/manifests/r/relmer/Casso" *> $null
          $published = ($LASTEXITCODE -eq 0)
          $global:LASTEXITCODE = 0

          if (-not $published) {
              if (-not $tokenOk) {
                  Write-Host "::warning::WINGET_PAT will not work as it stands: $tokenProblem."
              }
              Write-Host ("::notice::$pkgId is not in winget-pkgs yet, so there is nothing to " +
                          'update. Submit the first manifest once by hand -- ' +
                          'Installer/winget holds it and says how -- and this step picks up ' +
                          'from there by itself.')
              exit 0
          }

          # Past here the token is load-bearing, so a bad one is an error
          # rather than a warning.
          if (-not $tokenOk) { throw "WINGET_PAT cannot publish: $tokenProblem." }

          # Bring the fork up to date first. wingetcreate branches from it, and
          # a fork months behind produces a PR full of other people's packages.
          gh api repos/relmer/winget-pkgs/merge-upstream -f branch=master

          $dest = "$env:RUNNER_TEMP\wingetcreate.exe"
          Invoke-WebRequest -Uri 'https://aka.ms/wingetcreate/latest' -OutFile $dest -UseBasicParsing

          $baseUrl = "https://github.com/$env:GITHUB_REPOSITORY/releases/download/$tag"

          # ONE URL, because the installer is one bundle. wingetcreate reads
          # the .msixbundle, takes the package family name and the signature
          # hash out of it, and writes an Installer entry per architecture
          # from what it finds inside -- none of which it could do for the
          # zips, which is part of why the manifest is an msix one now.
          & $dest update $pkgId `
            --version $version `
            --urls "$baseUrl/Casso-$version.msixbundle" `
            --submit --token $env:GH_TOKEN

          if ($LASTEXITCODE -ne 0) {
              throw "wingetcreate failed ($LASTEXITCODE). The release itself is published and unaffected."
          }
