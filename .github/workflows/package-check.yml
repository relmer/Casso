name: Package check

# Builds and signs the MSIX bundle the way a release would, and hands it back
# as a workflow artifact. It publishes nothing, touches no tag and opens no
# winget pull request.
#
# THE POINT IS THAT THE BUNDLE IS REALLY SIGNED. An MSIX cannot be installed
# unless Windows trusts its signature, and nothing about the package can be
# tested until it installs: not the app execution aliases, not the tiles, and
# not what %LOCALAPPDATA% redirection does to first run. A locally packed
# bundle is untestable without either enabling Developer Mode or trusting a
# throwaway certificate machine-wide, and neither of those tests what a user
# would actually receive -- a bundle signed by the same certificate as the
# release, which chains to a root every Windows already trusts, and which
# therefore installs per-user with no ceremony at all.
#
# So: press the button, download the artifact, `Add-AppxPackage` it. That is
# the same file the release job would publish, built by the same scripts.
#
# It follows signing-check.yml's pattern and its reasoning about when to run:
# on a button, before a release worth caring about, and after anything that
# changes the packaging. Its own file rather than a job in ci.yml, so adding
# `workflow_dispatch` here does not give the build matrix a manual trigger it
# has no use for.

on:
  workflow_dispatch:

  # TEMPORARY, REMOVE BEFORE MERGING. workflow_dispatch is only offered for
  # workflows that exist on the default branch, so this file cannot be run
  # from its own branch until it is merged, and it has to be run before it is
  # merged. This trigger is the way out of that, and nothing else.
  push:
    branches: [msix-installer]

permissions:
  contents: read
  id-token: write

jobs:
  pack-and-sign:
    runs-on: windows-latest
    timeout-minutes: 45

    # The same environment the release job names, because the environment is
    # part of the OIDC subject. A dry run against a different subject would
    # prove the wrong credential.
    environment: release

    steps:
      - uses: actions/checkout@v6

      - name: Add MSBuild to PATH
        uses: microsoft/setup-msbuild@v3

      # Release only, and both architectures, because the bundle needs both.
      # No code analysis and no tests: ci.yml owns those verdicts, and this
      # job is asking about the package rather than about the code.
      - name: Build Release x64
        run: msbuild Casso.sln -p:Configuration=Release -p:Platform=x64 -p:PreBuildEventUseInBuild=false -p:PostBuildEventUseInBuild=false

      - name: Build Release ARM64
        run: msbuild Casso.sln -p:Configuration=Release -p:Platform=ARM64 -p:PreBuildEventUseInBuild=false -p:PostBuildEventUseInBuild=false

      - name: Read version from Version.h
        id: ver
        shell: pwsh
        run: |
          $content = Get-Content 'CassoCore/Version.h' -Raw
          if ($content -notmatch '#define VERSION_MAJOR (\d+)') { throw 'VERSION_MAJOR missing' }
          $major = $matches[1]
          if ($content -notmatch '#define VERSION_MINOR (\d+)') { throw 'VERSION_MINOR missing' }
          $minor = $matches[1]
          if ($content -notmatch '#define VERSION_PATCH (\d+)') { throw 'VERSION_PATCH missing' }
          $patch = $matches[1]
          "version=$major.$minor.$patch" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          Write-Host "Version: $major.$minor.$patch"

      - name: Stage release payloads
        shell: pwsh
        run: scripts/StageRelease.ps1 -Platforms x64, ARM64

      - name: Azure login (OIDC)
        uses: azure/login@v3
        with:
          client-id:       ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id:       ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      # The executables first, then the bundle, in that order and for the same
      # reason the release job does it that way: signing a container does not
      # reach inside it, so a bundle packed before this holds unsigned
      # binaries under a signed wrapper.
      - name: Sign the staged binaries
        uses: azure/artifact-signing-action@v2.0.0
        with:
          azure-tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          azure-client-id: ${{ secrets.AZURE_CLIENT_ID }}
          endpoint: https://wcus.codesigning.azure.net/
          signing-account-name: relmer-signing
          certificate-profile-name: relmer-public
          files-folder: ${{ github.workspace }}/staging
          files-folder-filter: exe
          files-folder-recurse: true
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256

      - name: Build the MSIX bundle
        shell: pwsh
        run: |
          scripts/BuildMsix.ps1 `
            -PayloadRoot staging `
            -OutputDirectory artifacts `
            -Version '${{ steps.ver.outputs.version }}' `
            -Platforms x64, ARM64

      - name: Sign the MSIX bundle
        uses: azure/artifact-signing-action@v2.0.0
        with:
          azure-tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          azure-client-id: ${{ secrets.AZURE_CLIENT_ID }}
          endpoint: https://wcus.codesigning.azure.net/
          signing-account-name: relmer-signing
          certificate-profile-name: relmer-public
          files-folder: ${{ github.workspace }}/artifacts
          files-folder-filter: msixbundle
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256

      # The same assertions the release job makes, so a failure here is a
      # failure there. The publisher comparison is the one that matters most:
      # signtool requires the certificate subject to match the manifest's
      # Publisher string exactly, and a mismatch is the one fault that would
      # pass every other check and then refuse to install.
      - name: Report what came back
        shell: pwsh
        run: |
          $bundle = Get-ChildItem artifacts -Filter *.msixbundle | Select-Object -First 1
          if (-not $bundle) { throw 'No .msixbundle was produced.' }

          $sig = Get-AuthenticodeSignature $bundle.FullName
          Write-Host "bundle:    $($bundle.Name)"
          Write-Host "status:    $($sig.Status)"
          Write-Host "signer:    $($sig.SignerCertificate.Subject)"
          Write-Host "timestamp: $($sig.TimeStamperCertificate.Subject)"

          if ($sig.Status -in @('NotSigned', 'HashMismatch')) {
              throw "The bundle is $($sig.Status) and cannot be installed."
          }

          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $zip = [IO.Compression.ZipFile]::OpenRead($bundle.FullName)
          try {
              $entry = $zip.Entries | Where-Object { $_.FullName -eq 'AppxMetadata/AppxBundleManifest.xml' }
              if (-not $entry) { throw 'The bundle has no AppxBundleManifest.xml.' }
              $reader = New-Object IO.StreamReader($entry.Open())
              try { $xml = [xml] $reader.ReadToEnd() } finally { $reader.Dispose() }
          }
          finally {
              $zip.Dispose()
          }

          $publisher = $xml.Bundle.Identity.Publisher
          Write-Host "publisher: $publisher"

          if ($publisher -ne $sig.SignerCertificate.Subject) {
              throw ("The bundle's Publisher and the certificate subject differ, so Windows " +
                     "will reject the package.`n  manifest: $publisher`n" +
                     "  cert:     $($sig.SignerCertificate.Subject)")
          }

          Write-Host ''
          Write-Host 'Signed and consistent. Download the artifact and install it with:'
          Write-Host "  Add-AppxPackage .\$($bundle.Name)"

      - name: Upload the bundle
        uses: actions/upload-artifact@v7
        with:
          name: msixbundle
          path: artifacts/*.msixbundle
          retention-days: 7
