name: Signing check

# A dry run of the only two steps in the release path that can fail for
# reasons the build never sees: the OIDC handshake with Entra, and the signing
# call itself. It publishes nothing and touches no tag.
#
# THE POINT IS WHEN IT RUNS. The release job is gated on a version bump, so a
# broken federated credential or a revoked role stays invisible until the
# middle of a release, which is the worst moment to find it. This runs on a
# button instead: press it after changing anything on the Azure side, or
# before a release you care about.
#
# It deliberately lives in its own file rather than as a job in ci.yml, so
# adding `workflow_dispatch` here does not give the 30-minute build matrix a
# manual trigger it has no use for.

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  sign-a-throwaway:
    runs-on: windows-latest
    timeout-minutes: 15

    # The same environment the release job names, because the environment is
    # part of the OIDC subject. A dry run against a different subject would
    # prove the wrong credential.
    environment: release

    steps:
      # A REAL PE, and an UNSIGNED one, and neither half is optional.
      #
      # Real, because an Authenticode signature is embedded in the PE's
      # certificate table rather than carried alongside it, so a text file
      # named .exe fails on its format and says nothing about the credential.
      #
      # Unsigned, because the first version of this job copied a Windows
      # binary and asked afterwards whether the file had a valid signature.
      # It did -- Microsoft's, the one it arrived with. The job passed while
      # signing had done nothing at all, which is the exact failure it exists
      # to catch. A file that starts with no signature cannot answer that
      # question wrongly.
      #
      # Compiling one is a minute of runner time and leaves nothing to
      # assume; the apphost dotnet emits is unsigned.
      - name: Build an unsigned binary to sign
        shell: pwsh
        run: |
          dotnet new console -o sampleproj --name sample
          dotnet publish sampleproj -c Release -o dryrun --nologo
          if (-not (Test-Path dryrun\sample.exe)) {
              Get-ChildItem dryrun | ForEach-Object { Write-Host "  $($_.Name)" }
              throw 'dotnet did not produce dryrun\sample.exe'
          }

          $before = Get-AuthenticodeSignature dryrun\sample.exe
          Write-Host "before: $($before.Status)"

          # If this ever arrives signed, every assertion below is worthless.
          if ($before.Status -ne 'NotSigned') {
              throw "The sample was already signed ($($before.Status)); this job cannot prove anything with it."
          }

      # A SECRET THAT EXISTS AND A SECRET THAT HOLDS SOMETHING are different
      # facts, and only the first one is visible from outside. `gh secret set`
      # with no value reads stdin, so running it where stdin is closed stores
      # an empty string and reports success -- after which the listing, the
      # API and the web UI all show three healthy-looking secrets. Ask the
      # question here, where the answer can say what is actually wrong,
      # instead of letting it surface as azure/login complaining that
      # client-id was not supplied.
      - name: The secrets have to hold something
        shell: pwsh
        env:
          CLIENT_ID:       ${{ secrets.AZURE_CLIENT_ID }}
          TENANT_ID:       ${{ secrets.AZURE_TENANT_ID }}
          SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
        run: |
          $empty = @()
          foreach ($name in 'CLIENT_ID', 'TENANT_ID', 'SUBSCRIPTION_ID') {
              $value = [Environment]::GetEnvironmentVariable($name)
              $len   = if ($value) { $value.Length } else { 0 }
              Write-Host "  AZURE_${name}: $len characters"
              if ($len -eq 0) { $empty += "AZURE_$name" }
          }
          if ($empty) {
              throw ("Empty: $($empty -join ', '). The secret exists but holds " +
                     'nothing. Re-set it with an explicit value -- ' +
                     '`gh secret set NAME --repo <repo> --body <guid>` -- or ' +
                     'through Settings > Secrets and variables > Actions.')
          }

      - name: Azure login (OIDC)
        uses: azure/login@v3
        with:
          client-id:       ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id:       ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Sign it
        uses: azure/artifact-signing-action@v2.0.0
        with:
          azure-tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          azure-client-id: ${{ secrets.AZURE_CLIENT_ID }}
          endpoint: https://wcus.codesigning.azure.net/
          signing-account-name: relmer-signing
          certificate-profile-name: relmer-public
          files-folder: ${{ github.workspace }}/dryrun
          files-folder-filter: exe
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256

      - name: Report what came back
        shell: pwsh
        run: |
          $sig = Get-AuthenticodeSignature dryrun\sample.exe

          Write-Host "status:    $($sig.Status)"
          Write-Host "statusmsg: $($sig.StatusMessage)"
          Write-Host "signer:    $($sig.SignerCertificate.Subject)"
          Write-Host "issuer:    $($sig.SignerCertificate.Issuer)"
          Write-Host "notAfter:  $($sig.SignerCertificate.NotAfter)"
          Write-Host "timestamp: $($sig.TimeStamperCertificate.Subject)"

          # The sample went in unsigned, so anything other than a signature
          # coming back means the action ran and did nothing -- which it does
          # quietly, and which is the whole reason this job exists.
          if ($sig.Status -eq 'NotSigned') {
              throw 'The signing step ran and left the file unsigned.'
          }

          # And it has to be OUR signature. A signer that is anyone else means
          # the file being inspected is not the file that was signed.
          if ($sig.SignerCertificate.Subject -match 'Microsoft Corporation') {
              throw "Signed by $($sig.SignerCertificate.Subject) -- that is not this account's certificate."
          }

          # A short NotAfter is expected and not a fault: these certificates
          # live for days, which is what the countersignature is for -- the
          # timestamp is what keeps a shipped binary trusted past it.
          if (-not $sig.TimeStamperCertificate) {
              Write-Host '::warning::Signed but not countersigned; the signature will stop verifying when the certificate expires.'
          }

          Write-Host ''
          Write-Host 'Credential works. The release job will sign.'
