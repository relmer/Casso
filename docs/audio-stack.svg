<svg xmlns="http://www.w3.org/2000/svg" width="680" height="692" viewBox="0 0 680 692" role="img" aria-labelledby="title desc">
<title id="title">Casso audio stack</title>
<desc id="desc">Speaker, disk drives, printer and Mockingboard sources feed generators and mixers, are mixed in SubmitFrame on the CPU thread, queued, drained by the WASAPI render pump thread, and played through the Windows mixer.</desc>
<style>
  svg { font-family: "Segoe UI", "Helvetica Neue", Arial, sans-serif; }
  .bg { fill: #FFFFFF; }
  rect.n { fill: #F1EFE8; stroke: #5F5E5A; }
  g.purple rect { fill: #EEEDFE; stroke: #534AB7; }
  g.purple .th { fill: #3C3489; } g.purple .ts { fill: #534AB7; }
  g.teal rect { fill: #E1F5EE; stroke: #0F6E56; }
  g.teal .th { fill: #085041; } g.teal .ts { fill: #0F6E56; }
  g.gray rect { fill: #F1EFE8; stroke: #5F5E5A; }
  g.gray .th { fill: #444441; } g.gray .ts { fill: #5F5E5A; }
  rect { stroke-width: 1; }
  .th { font-size: 14px; font-weight: 500; }
  .ts { font-size: 12px; fill: #5F5E5A; }
  .arr { stroke: #5F5E5A; stroke-width: 1.5; fill: none; }
  .div { stroke: #888780; stroke-width: 1; stroke-dasharray: 5 4; }
  @media (prefers-color-scheme: dark) {
    .bg { fill: #1A1A18; }
    rect.n { fill: #2C2C2A; stroke: #B4B2A9; }
    g.purple rect { fill: #3C3489; stroke: #AFA9EC; }
    g.purple .th { fill: #CECBF6; } g.purple .ts { fill: #AFA9EC; }
    g.teal rect { fill: #085041; stroke: #5DCAA5; }
    g.teal .th { fill: #9FE1CB; } g.teal .ts { fill: #5DCAA5; }
    g.gray rect { fill: #2C2C2A; stroke: #B4B2A9; }
    g.gray .th { fill: #D3D1C7; } g.gray .ts { fill: #B4B2A9; }
    .ts { fill: #B4B2A9; }
    .arr { stroke: #B4B2A9; }
  }
</style>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect class="bg" x="0" y="0" width="680" height="692" stroke="none"/>
<g class="purple"><rect x="40" y="40" width="130" height="56" rx="4"/><text class="th" x="105" y="63" text-anchor="middle">Speaker</text><text class="ts" x="105" y="82" text-anchor="middle">$C030 toggles</text></g>
<g class="purple"><rect x="190" y="40" width="130" height="56" rx="4"/><text class="th" x="255" y="63" text-anchor="middle">Disk ][ drives</text><text class="ts" x="255" y="82" text-anchor="middle">One source per drive</text></g>
<g class="purple"><rect x="340" y="40" width="130" height="56" rx="4"/><text class="th" x="405" y="63" text-anchor="middle">Printer</text><text class="ts" x="405" y="82" text-anchor="middle">PrinterAudioSource</text></g>
<g class="purple"><rect x="490" y="40" width="150" height="56" rx="4"/><text class="th" x="565" y="63" text-anchor="middle">Mockingboard</text><text class="ts" x="565" y="82" text-anchor="middle">2 AY PSGs + SSI-263</text></g>
<line x1="105" y1="96" x2="105" y2="134" class="arr" marker-end="url(#arrow)"/>
<line x1="255" y1="96" x2="255" y2="134" class="arr" marker-end="url(#arrow)"/>
<line x1="405" y1="96" x2="405" y2="134" class="arr" marker-end="url(#arrow)"/>
<line x1="565" y1="96" x2="565" y2="134" class="arr" marker-end="url(#arrow)"/>
<g class="teal"><rect x="40" y="136" width="130" height="56" rx="4"/><text class="th" x="105" y="159" text-anchor="middle">AudioGenerator</text><text class="ts" x="105" y="178" text-anchor="middle">Mono, centered</text></g>
<g class="teal"><rect x="190" y="136" width="280" height="56" rx="4"/><text class="th" x="330" y="159" text-anchor="middle">DriveAudioMixer (drive)</text><text class="ts" x="330" y="178" text-anchor="middle">Cycle Tick, stereo PCM</text></g>
<g class="teal"><rect x="490" y="136" width="150" height="56" rx="4"/><text class="th" x="565" y="159" text-anchor="middle">DriveAudioMixer</text><text class="ts" x="565" y="178" text-anchor="middle">Mockingboard, stereo</text></g>
<line x1="105" y1="192" x2="105" y2="230" class="arr" marker-end="url(#arrow)"/>
<line x1="330" y1="192" x2="330" y2="230" class="arr" marker-end="url(#arrow)"/>
<line x1="565" y1="192" x2="565" y2="230" class="arr" marker-end="url(#arrow)"/>
<g class="teal"><rect x="40" y="232" width="600" height="56" rx="4"/><text class="th" x="340" y="255" text-anchor="middle">WasapiAudio::SubmitFrame</text><text class="ts" x="340" y="274" text-anchor="middle">Additive stereo mix, then master gain</text></g>
<line x1="230" y1="288" x2="230" y2="318" class="arr" marker-end="url(#arrow)"/>
<line x1="550" y1="288" x2="550" y2="318" class="arr" marker-end="url(#arrow)"/>
<g class="teal"><rect x="40" y="320" width="380" height="44" rx="4"/><text class="th" x="230" y="347" text-anchor="middle">Pending sample queue (mutex)</text></g>
<rect class="n" x="460" y="320" width="180" height="44" rx="4" stroke-dasharray="4 3"/><text class="ts" x="550" y="346" text-anchor="middle">CASSO_AUDIO_DUMP file</text>
<line x1="40" y1="390" x2="640" y2="390" class="div"/>
<text class="ts" x="40" y="382">CPU thread</text><text class="ts" x="40" y="406">Render thread</text>
<line x1="230" y1="364" x2="230" y2="414" class="arr" marker-end="url(#arrow)"/>
<g class="teal"><rect x="40" y="416" width="600" height="56" rx="4"/><text class="th" x="340" y="439" text-anchor="middle">WasapiAudio::RenderPump</text><text class="ts" x="340" y="458" text-anchor="middle">Event-driven drain, mono downmix, underrun filler</text></g>
<line x1="230" y1="472" x2="230" y2="510" class="arr" marker-end="url(#arrow)"/>
<g class="gray"><rect x="40" y="512" width="380" height="56" rx="4"/><text class="th" x="230" y="535" text-anchor="middle">IAudioClient / IAudioRenderClient</text><text class="ts" x="230" y="554" text-anchor="middle">Default endpoint, shared mode</text></g>
<g class="gray"><rect x="460" y="512" width="180" height="56" rx="4"/><text class="th" x="550" y="535" text-anchor="middle">Endpoint notifier</text><text class="ts" x="550" y="554" text-anchor="middle">Reopen on device change</text></g>
<line x1="460" y1="540" x2="422" y2="540" class="arr" marker-end="url(#arrow)"/>
<line x1="230" y1="568" x2="230" y2="606" class="arr" marker-end="url(#arrow)"/>
<g class="gray"><rect x="40" y="608" width="380" height="44" rx="4"/><text class="th" x="230" y="635" text-anchor="middle">Windows audio mixer, speakers</text></g>
</svg>
