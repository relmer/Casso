<g class="teal"><rect x="50" y="446" width="250" height="50" rx="4"/><text class="th" x="175" y="468" text-anchor="middle">WasapiAudio::SubmitFrame</text><text class="ts" x="175" y="485" text-anchor="middle">mixes one slice of audio</text></g>
