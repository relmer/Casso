<g class="gray"><rect x="335" y="656" width="250" height="50" rx="4"/><text class="th" x="460" y="678" text-anchor="middle">ReadDirectoryChangesW</text><text class="ts" x="460" y="695" text-anchor="middle">waits on the folder</text></g>
