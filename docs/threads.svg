<svg xmlns="http://www.w3.org/2000/svg" width="960" height="790" viewBox="0 0 960 790" role="img" aria-labelledby="title desc">
<title id="title">Casso threads and the handoffs between them</title>
<desc id="desc">Swimlanes for the controller input, UI, CPU, audio render, disk image watcher and printer threads, with every mechanism that passes data between them: posted window messages, the command queue, input atomics, the frame handoff, debug rings, the audio sample queue, pending disk changes, the printer byte ring and the printer raster.</desc>
<style>
  svg { font-family: "Segoe UI", "Helvetica Neue", Arial, sans-serif; }
  .bg { fill: #FFFFFF; }
  .lane { fill: #FAF9F5; stroke: #D3D1C7; stroke-width: 1; }
  .lt { font-size: 14px; font-weight: 600; fill: #2C2C2A; }
  .ls { font-size: 12px; fill: #5F5E5A; font-family: Consolas, "SF Mono", Menlo, monospace; }
  g.purple rect { fill: #EEEDFE; stroke: #534AB7; }
  g.purple .th { fill: #3C3489; } g.purple .ts { fill: #534AB7; }
  g.teal rect { fill: #E1F5EE; stroke: #0F6E56; }
  g.teal .th { fill: #085041; } g.teal .ts { fill: #0F6E56; }
  g.gray rect { fill: #F1EFE8; stroke: #5F5E5A; }
  g.gray .th { fill: #444441; } g.gray .ts { fill: #5F5E5A; }
  rect { stroke-width: 1; }
  .th { font-size: 13px; font-weight: 500; }
  .ts { font-size: 11.5px; fill: #5F5E5A; }
  .note { font-size: 12px; fill: #5F5E5A; }
  .arr { stroke: #5F5E5A; stroke-width: 1.5; fill: none; }
  @media (prefers-color-scheme: dark) {
    .bg { fill: #1A1A18; }
    .lane { fill: #222220; stroke: #444441; }
    .lt { fill: #E8E6DF; }
    .ls { fill: #B4B2A9; }
    g.purple rect { fill: #3C3489; stroke: #AFA9EC; }
    g.purple .th { fill: #CECBF6; } g.purple .ts { fill: #AFA9EC; }
    g.teal rect { fill: #085041; stroke: #5DCAA5; }
    g.teal .th { fill: #9FE1CB; } g.teal .ts { fill: #5DCAA5; }
    g.gray rect { fill: #2C2C2A; stroke: #B4B2A9; }
    g.gray .th { fill: #D3D1C7; } g.gray .ts { fill: #B4B2A9; }
    .ts, .note { fill: #B4B2A9; }
    .arr { stroke: #B4B2A9; }
  }
</style>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
