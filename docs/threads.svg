<path d="M875 681 H920 V281 H872" class="arr" marker-end="url(#arrow)"/>
<text class="ts" transform="translate(936 481) rotate(-90)" text-anchor="middle">Printer raster, mutex</text>
<text class="note" x="30" y="760">Teal: Casso code. Purple: a handoff between threads, with the arrow in the direction the data moves. Gray: a Windows API.</text>
<text class="note" x="30" y="778">A machine switch on the CPU thread takes the machine lifetime lock exclusively; the UI thread takes it shared.</text>
</svg>
