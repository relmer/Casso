<g class="purple"><rect x="211" y="338" width="156" height="54" rx="4"/><text class="th" x="289" y="362" text-anchor="middle">Input atomics</text><text class="ts" x="289" y="379" text-anchor="middle">keyboard, mouse, paddles</text></g>
