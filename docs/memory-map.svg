<text x="812" y="660"><tspan class="nsw">ALTZP</tspan><tspan class="note" dx="6">main or aux</tspan></text>
<path class="brk" d="M798 345 h6 V631 h-6"/>
<text x="812" y="398"><tspan class="nsw">RAMRD</tspan><tspan class="note" dx="6">selects reads</tspan></text>
<text x="812" y="416"><tspan class="nsw">RAMWRT</tspan><tspan class="note" dx="6">selects writes</tspan></text>
<text x="812" y="578" xml:space="preserve"><tspan class="note">With </tspan><tspan class="nsw">80STORE</tspan><tspan class="note"> on, </tspan><tspan class="nsw">PAGE2</tspan><tspan class="note"> selects main or aux,</tspan></text>
<text x="812" y="594" xml:space="preserve"><tspan class="note">instead of </tspan><tspan class="nsw">RAMRD</tspan><tspan class="note"> and </tspan><tspan class="nsw">RAMWRT</tspan></text>
<text x="812" y="475" xml:space="preserve"><tspan class="note">With </tspan><tspan class="nsw">80STORE</tspan><tspan class="note"> and </tspan><tspan class="nsw">HIRES</tspan><tspan class="note"> on,</tspan></text>
<text x="812" y="490" xml:space="preserve"><tspan class="note"></tspan><tspan class="nsw">PAGE2</tspan><tspan class="note"> selects main or aux,</tspan></text>
<text x="812" y="505" xml:space="preserve"><tspan class="note">instead of </tspan><tspan class="nsw">RAMRD</tspan><tspan class="note"> and </tspan><tspan class="nsw">RAMWRT</tspan></text>
<text x="812" y="328"><tspan class="nsw"></tspan><tspan class="note" dx="0">fixed by address</tspan></text>
<text x="812" y="290"><tspan class="nsw">INTCXROM, SLOTC3ROM</tspan><tspan class="note" dx="6">($C3xx)</tspan></text>
<text x="812" y="253"><tspan class="nsw">INTC8ROM</tspan><tspan class="note" dx="6">set by $C3xx, cleared by $CFFF</tspan></text>
<path class="brk" d="M798 87 h6 V229 h-6"/>
<text x="812" y="148"><tspan class="nsw">$C080–$C08F</tspan><tspan class="note" dx="6">ROM or RAM,</tspan></text>
<text x="812" y="166"><tspan class="nsw"></tspan><tspan class="note" dx="0">bank 1 or 2, write enable</tspan></text>
<text x="812" y="188"><tspan class="nsw">ALTZP</tspan><tspan class="note" dx="6">main or aux RAM</tspan></text>
<g class="ram"><rect x="30" y="706" width="22" height="16" rx="3" stroke-width="1"/></g><text class="foot" x="60" y="718">RAM</text>
<g class="rom"><rect x="110" y="706" width="22" height="16" rx="3" stroke-width="1"/></g><text class="foot" x="140" y="718">ROM</text>
<g class="io"><rect x="190" y="706" width="22" height="16" rx="3" stroke-width="1"/></g><text class="foot" x="220" y="718">I/O</text>
<rect class="pt"  x="290" y="706" width="12" height="16"/><text class="foot" x="310" y="718">Casso reads or writes through the page table: one pointer load, no function call</text>
<rect class="dev" x="290" y="730" width="12" height="16"/><text class="foot" x="310" y="742">Casso calls the device's Read or Write, which can change soft switches or other state</text>
<text class="foot" x="30" y="778">Apple //c: reads of $C100–$CFFF, except $C3xx and $CFxx, use the page table into internal ROM. $C028 switches the 32K ROM bank.</text>
<text class="foot" x="30" y="798">Apple ][ and ][+: main memory and ROM only. Slot and motherboard ROMs are read through the device map unless a language card is configured.</text>
</svg>
