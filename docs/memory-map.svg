<svg xmlns="http://www.w3.org/2000/svg" width="1090" height="848" viewBox="0 0 1090 848" role="img" aria-labelledby="title desc">
<title id="title">The Apple //e memory map as Casso serves it</title>
<desc id="desc">The //e address space drawn from $0000 at the bottom to $FFFF at the top, with main memory, auxiliary memory, and ROM and I/O in side-by-side columns, the soft switches that select among them, and two strips showing whether Casso serves reads and writes in each range through the page table or the device map.</desc>
<style>
  svg { font-family: "Segoe UI", "Helvetica Neue", Arial, sans-serif; }
  .bg { fill: #FFFFFF; }
  .hdr { font-size: 13px; font-weight: 600; fill: #2C2C2A; }
  .hsub { font-size: 11.5px; fill: #5F5E5A; }
  .ax { font-size: 12px; fill: #444441; font-family: Consolas, "SF Mono", Menlo, monospace; }
  .tick { stroke: #B4B2A9; stroke-width: 1; }
  .bt { font-size: 12.5px; font-weight: 500; }
  .bs { font-size: 11px; }
  .ram rect { fill: #F1EFE8; stroke: #8A887F; } .ram .bt { fill: #2C2C2A; } .ram .bs { fill: #5F5E5A; }
  .rom rect { fill: #FAEEDA; stroke: #BA7517; } .rom .bt { fill: #633806; } .rom .bs { fill: #854F0B; }
  .io  rect { fill: #FBEAF0; stroke: #993556; } .io  .bt { fill: #72243E; } .io  .bs { fill: #993556; }
  .pt  { fill: #1D9E75; } .dev { fill: #7F77DD; }
  .note { font-size: 12px; fill: #444441; }
  .nsw { font-family: Consolas, "SF Mono", Menlo, monospace; font-size: 11.5px; fill: #2C2C2A; font-weight: 600; }
  .brk { stroke: #888780; stroke-width: 1.2; fill: none; }
  .foot { font-size: 12px; fill: #5F5E5A; }
  @media (prefers-color-scheme: dark) {
    .bg { fill: #1A1A18; }
    .hdr { fill: #E8E6DF; } .hsub, .foot { fill: #B4B2A9; }
    .ax { fill: #D3D1C7; } .tick { stroke: #5F5E5A; }
    .ram rect { fill: #2C2C2A; stroke: #8A887F; } .ram .bt { fill: #E8E6DF; } .ram .bs { fill: #B4B2A9; }
    .rom rect { fill: #412402; stroke: #EF9F27; } .rom .bt { fill: #FAC775; } .rom .bs { fill: #EF9F27; }
    .io  rect { fill: #4B1528; stroke: #ED93B1; } .io  .bt { fill: #F4C0D1; } .io  .bs { fill: #ED93B1; }
    .note { fill: #D3D1C7; } .nsw { fill: #E8E6DF; }
    .brk { stroke: #888780; }
  }
</style>
